# Fixed project name: other repos also keep compose files in a database/
# folder, and the default project name would make them replace each other.
name: hacksgiving

services:
  postgres:
    image: pgvector/pgvector:0.8.4-pg16
    container_name: hacksgiving-postgres
    restart: unless-stopped
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, standing in locally for the private
  # Supabase Storage bucket Phantom's audio goes to in production. Same S3
  # protocol, so the API and worker run the same code against either.
  # Credentials: STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in .env (they must
  # match APP__STORAGE__* in api/.env). The bucket is created by the API.
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: hacksgiving-storage
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"hacksgiving","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=2 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${STORAGE_PORT:-8333}:8333"
    volumes:
      - ./storage:/data
