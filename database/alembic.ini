# Alembic owns Hacksgiving's schema (design §4.1, docs/decisions/0003).
# Run through ./migrate.sh, or from this directory:
#   uv run --project ../api alembic upgrade head
# The connection comes from HACKSGIVING_MIGRATION_DATABASE_URL (see migrations/env.py),
# never from this file.

[alembic]
script_location = %(here)s/migrations
# Revisions are numbered (0001, 0002, ...) and each one runs explicit SQL.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
