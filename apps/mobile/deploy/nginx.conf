# The exported web app (../web.Dockerfile). Every route is client-side
# (expo-router), so unknown paths serve index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed bundles never change: cache them for a year.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        # index.html must revalidate so a deploy is picked up on reload.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri.html /index.html;
    }
}
